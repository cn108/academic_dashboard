# Nginx for the production stack: the compiled SPA at /, Django behind /api/,
# /admin/, /static/ and /media/.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assignment and lesson-note uploads are capped at 10 MB in the UI.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # API and Django-rendered surfaces.
    # `^~` keeps these prefixes ahead of the static-file regex below, which would
    # otherwise swallow /static/admin/*.css and return the SPA's 404.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CSS and DRF assets come from WhiteNoise inside the backend.
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Uploaded files (assignment submissions, note attachments).
    location ^~ /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker and its manifest must never be served stale, or the
    # installed app keeps an old shell forever.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    # Hashed build output is safe to cache for a year.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA deep links (/teacher/broadsheet, /student/results, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
