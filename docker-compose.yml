name: academic-dashboard

# Local production-style stack: PostgreSQL, Gunicorn behind Nginx, and the
# compiled Angular SPA. `docker compose up --build` then browse
# http://localhost:8080. Add docker-compose.prod.yml for public HTTPS.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dashboard}
      DEFAULT_STUDENT_PASSWORD: ${DEFAULT_STUDENT_PASSWORD:-Student@1234}
      SCHOOL_NAME: ${SCHOOL_NAME:-Model Secondary School}
      SERVE_MEDIA: "True"
      # Set to True once the stack sits behind a TLS terminator such as Caddy
      # or a cloud load balancer.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      AXES_ENABLED: "True"
      LOG_LEVEL: INFO
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-SchoolApp}
      TERMII_WHATSAPP_DEVICE_ID: ${TERMII_WHATSAPP_DEVICE_ID:-}
      TERMII_WHATSAPP_TEMPLATE_ID: ${TERMII_WHATSAPP_TEMPLATE_ID:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-False}
    volumes:
      - media:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    # Loopback only: Caddy is the public entry point in docker-compose.prod.yml.
    # This also keeps a plain-HTTP bypass off the public interface locally.
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media:
