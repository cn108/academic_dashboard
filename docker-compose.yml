services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: local-docker-secret-key-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: postgres://dashboard:dashboard@db:5432/dashboard
      DEFAULT_STUDENT_PASSWORD: Student@1234
      SECURE_SSL_REDIRECT: "False"
      AXES_ENABLED: "True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
